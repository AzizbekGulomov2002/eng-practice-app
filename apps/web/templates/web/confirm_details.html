{% extends "web/base.html" %}
{% block title %}Confirm your details{% endblock %}
{% block body_class %}inner_page exam-gate{% endblock %}
{% block content %}
<div class="gate-wrap">
   <div class="gate-card">
      <div class="gate-icon"><i class="fa fa-id-card-o" aria-hidden="true"></i></div>
      <h1>Confirm your details</h1>
      <p><strong>Name:</strong> {{ full_name }}</p>
      <p><strong>Phone number:</strong> {{ phone }}</p>
      <form method="post" action="{{ resume_url }}">
         {% csrf_token %}
         <input type="hidden" name="confirm_details" value="1">
         <button class="gate-btn" type="submit">My details are correct</button>
      </form>
   </div>
</div>
{% endblock %}
