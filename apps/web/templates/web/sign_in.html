{% extends "web/base.html" %}
{% block title %}Sign in — EcoCourse{% endblock %}
{% block content %}
<div class="contact">
   <div class="container">
      <div class="row">
         <div class="col-md-12">
            <div class="titlepage text_align_center">
               <span>Student & teacher access</span>
               <h2>Sign in</h2>
            </div>
         </div>
         <div class="col-md-8 offset-md-2">
            <form class="main_form" method="post">
               {% csrf_token %}
               {% if request.GET.next %}<input type="hidden" name="next" value="{{ request.GET.next }}">{% endif %}
               <div class="row">
                  <div class="col-md-12">
                     <input class="form_control" placeholder="Username or phone number" type="text" name="phone" required autocomplete="username">
                  </div>
                  <div class="col-md-12">
                     <input class="form_control" placeholder="Password" type="password" name="password" required autocomplete="current-password">
                  </div>
                  <div class="col-md-12">
                     <div class="group_btn">
                        <button class="send_btn" type="submit">Sign in</button>
                     </div>
                  </div>
               </div>
            </form>
         </div>
      </div>
   </div>
</div>
{% endblock %}
