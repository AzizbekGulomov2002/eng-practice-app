{% extends "web/base.html" %}
{% load static %}
{% block title %}EcoCourse{% endblock %}

{% block content %}
<section class="about about-research">
   <div class="container">
      <div class="home-intro">
         <h1>English practice app</h1>
      </div>
   </div>
</section>

<div class="services">
   <div class="container">
      <div class="row">
         <div class="col-md-12">
            <div class="titlepage text_align_left">
               <span>What you practice</span>
               <h2>Skills we offer</h2>
            </div>
         </div>
      </div>
      <div class="row">
         <div class="col-lg-3 col-md-6">
            <a class="skill-card" href="{% url 'start_skill' 'reading' %}">
               <div class="services_box text_align_left">
                  <figure><img src="{% static 'images/reading.png' %}" alt="Reading"/></figure>
                  <div class="veget">
                     <h3>Reading</h3>
                     <span class="read_more">Start</span>
                  </div>
               </div>
            </a>
         </div>
         <div class="col-lg-3 col-md-6">
            <a class="skill-card" href="{% url 'start_skill' 'writing' %}">
               <div class="services_box text_align_left">
                  <figure><img src="{% static 'images/writing.png' %}" alt="Writing"/></figure>
                  <div class="veget">
                     <h3>Writing</h3>
                     <span class="read_more">Start</span>
                  </div>
               </div>
            </a>
         </div>
         <div class="col-lg-3 col-md-6">
            <a class="skill-card" href="{% url 'start_skill' 'listening' %}">
               <div class="services_box text_align_left">
                  <figure><img src="{% static 'images/listening.png' %}" alt="Listening"/></figure>
                  <div class="veget">
                     <h3>Listening</h3>
                     <span class="read_more">Start</span>
                  </div>
               </div>
            </a>
         </div>
         <div class="col-lg-3 col-md-6">
            <a class="skill-card" href="{% url 'start_skill' 'speaking' %}">
               <div class="services_box text_align_left">
                  <figure><img src="{% static 'images/speaking.png' %}" alt="Speaking"/></figure>
                  <div class="veget">
                     <h3>Speaking</h3>
                     <span class="read_more">Start</span>
                  </div>
               </div>
            </a>
         </div>
      </div>
   </div>
</div>
{% endblock %}
